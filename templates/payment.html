<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Payment - Cloud Storage</title>
	<link rel="stylesheet" href="/static/styles.css" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
	<style>
		.payment-page {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 40px 20px;
		}
		
		.payment-card {
			background: rgba(255, 255, 255, 0.08);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 24px;
			padding: 40px;
			max-width: 500px;
			width: 100%;
			box-shadow: 0 25px 50px rgba(0,0,0,0.4);
		}
		
		.payment-header {
			text-align: center;
			margin-bottom: 30px;
		}
		
		.payment-header i {
			font-size: 3rem;
			color: #6366f1;
			margin-bottom: 15px;
		}
		
		.payment-header h2 {
			color: #fff;
			margin-bottom: 10px;
		}
		
		.payment-header p {
			color: #9ca3af;
			margin: 0;
		}
		
		.plan-summary {
			background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
			border: 1px solid rgba(99, 102, 241, 0.3);
			border-radius: 16px;
			padding: 20px;
			margin-bottom: 30px;
		}
		
		.plan-summary h4 {
			color: #fff;
			margin-bottom: 5px;
		}
		
		.plan-summary .price {
			font-size: 2rem;
			font-weight: 700;
			color: #fff;
		}
		
		.plan-summary .price span {
			font-size: 1rem;
			color: #9ca3af;
			font-weight: 400;
		}
		
		.plan-features-list {
			list-style: none;
			padding: 0;
			margin: 15px 0 0;
		}
		
		.plan-features-list li {
			color: #e5e7eb;
			padding: 5px 0;
			display: flex;
			align-items: center;
			gap: 8px;
		}
		
		.plan-features-list i {
			color: #10b981;
			font-size: 1rem;
		}
		
		.payment-form .form-label {
			color: #e5e7eb;
			font-weight: 500;
		}
		
		.payment-form .form-control {
			background: rgba(255, 255, 255, 0.1);
			border: 1px solid rgba(255, 255, 255, 0.2);
			color: #fff;
			padding: 12px 16px;
			border-radius: 12px;
		}
		
		.payment-form .form-control:focus {
			background: rgba(255, 255, 255, 0.15);
			border-color: #6366f1;
			box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
		}
		
		.payment-form .form-control::placeholder {
			color: #6b7280;
		}
		
		.card-input-group {
			position: relative;
		}
		
		.card-input-group i {
			position: absolute;
			right: 15px;
			top: 50%;
			transform: translateY(-50%);
			color: #6b7280;
		}
		
		.pay-button {
			width: 100%;
			padding: 15px;
			font-size: 1.1rem;
			font-weight: 600;
			margin-top: 20px;
		}
		
		.secure-badge {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			color: #6b7280;
			font-size: 0.875rem;
			margin-top: 20px;
		}
		
		.secure-badge i {
			color: #10b981;
		}
		
		/* Loading overlay */
		.loading-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(15, 23, 42, 0.95);
			backdrop-filter: blur(10px);
			z-index: 9999;
			align-items: center;
			justify-content: center;
			flex-direction: column;
		}
		
		.loading-overlay.active {
			display: flex;
		}
		
		.spinner-large {
			width: 60px;
			height: 60px;
			border: 4px solid rgba(255,255,255,0.1);
			border-top-color: #6366f1;
			border-radius: 50%;
			animation: spin 1s linear infinite;
			margin-bottom: 20px;
		}
		
		.loading-text {
			color: #fff;
			font-size: 1.2rem;
			text-align: center;
		}
		
		.success-check {
			width: 80px;
			height: 80px;
			background: linear-gradient(135deg, #10b981, #34d399);
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-bottom: 20px;
			animation: scaleIn 0.3s ease;
		}
		
		.success-check i {
			font-size: 2.5rem;
			color: #fff;
		}
		
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		
		@keyframes scaleIn {
			from { transform: scale(0); opacity: 0; }
			to { transform: scale(1); opacity: 1; }
		}
		
		.demo-badge {
			position: fixed;
			top: 20px;
			right: 20px;
			background: rgba(245, 158, 11, 0.2);
			border: 1px solid rgba(245, 158, 11, 0.5);
			color: #fbbf24;
			padding: 8px 16px;
			border-radius: 20px;
			font-size: 0.875rem;
			font-weight: 500;
		}
	</style>
</head>
<body>
	<div class="demo-badge">
		<i class="bi bi-info-circle me-1"></i>Demo Payment Mode
	</div>

	<div class="payment-page">
		<div class="payment-card">
			<div class="payment-header">
				<i class="bi bi-credit-card"></i>
				<h2>Complete Payment</h2>
				<p>Upgrade your storage plan securely</p>
			</div>
			
			<div class="plan-summary">
				<div class="d-flex justify-content-between align-items-start">
					<div>
						<h4 id="planName">Pro Plan</h4>
						<ul class="plan-features-list">
							<li><i class="bi bi-check-circle-fill"></i> 10 GB Storage</li>
							<li><i class="bi bi-check-circle-fill"></i> Priority Support</li>
							<li><i class="bi bi-check-circle-fill"></i> 30-day Share Links</li>
						</ul>
					</div>
					<div class="price" id="planPrice">₹749<span>/month</span></div>
				</div>
			</div>
			
			<form class="payment-form" id="paymentForm">
				<div class="mb-3">
					<label class="form-label">Card Number</label>
					<div class="card-input-group">
						<input type="text" class="form-control" placeholder="1234 5678 9012 3456" maxlength="19" id="cardNumber">
						<i class="bi bi-credit-card"></i>
					</div>
				</div>
				
				<div class="row g-3 mb-3">
					<div class="col-6">
						<label class="form-label">Expiry Date</label>
						<input type="text" class="form-control" placeholder="MM/YY" maxlength="5" id="expiryDate">
					</div>
					<div class="col-6">
						<label class="form-label">CVV</label>
						<input type="text" class="form-control" placeholder="123" maxlength="3" id="cvv">
					</div>
				</div>
				
				<div class="mb-3">
					<label class="form-label">Cardholder Name</label>
					<input type="text" class="form-control" placeholder="Name on card" id="cardName">
				</div>
				
				<button type="submit" class="btn btn-gradient pay-button" id="payButton">
					<i class="bi bi-lock-fill me-2"></i>Pay ₹749
				</button>
			</form>
			
			<div class="secure-badge">
				<i class="bi bi-shield-check"></i>
				<span>Secure 256-bit SSL Encrypted</span>
			</div>
			
			<div class="text-center mt-3">
				<a href="/profile" class="text-muted small">Cancel and return</a>
			</div>
		</div>
	</div>
	
	<!-- Loading/Success Overlay -->
	<div class="loading-overlay" id="loadingOverlay">
		<div class="spinner-large" id="loadingSpinner"></div>
		<div class="success-check d-none" id="successCheck">
			<i class="bi bi-check-lg"></i>
		</div>
		<div class="loading-text" id="loadingText">Processing payment...</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		// Card number formatting
		document.getElementById('cardNumber').addEventListener('input', function(e) {
			let value = e.target.value.replace(/\s/g, '');
			value = value.replace(/\D/g, '');
			let formattedValue = '';
			for (let i = 0; i < value.length; i++) {
				if (i > 0 && i % 4 === 0) formattedValue += ' ';
				formattedValue += value[i];
			}
			e.target.value = formattedValue;
		});
		
		// Expiry date formatting
		document.getElementById('expiryDate').addEventListener('input', function(e) {
			let value = e.target.value.replace(/\D/g, '');
			if (value.length >= 2) {
				value = value.substring(0, 2) + '/' + value.substring(2, 4);
			}
			e.target.value = value;
		});
		
		// Get plan from URL parameter
		const urlParams = new URLSearchParams(window.location.search);
		const plan = urlParams.get('plan') || 'pro';
		
		const plans = {
			pro: { name: 'Pro Plan', price: 749, storage: '10 GB' },
			business: { name: 'Business Plan', price: 2499, storage: '100 GB' }
		};
		
		const selectedPlan = plans[plan] || plans.pro;
		document.getElementById('planName').textContent = selectedPlan.name;
		document.getElementById('planPrice').innerHTML = `₹${selectedPlan.price}<span>/month</span>`;
		document.getElementById('payButton').innerHTML = `<i class="bi bi-lock-fill me-2"></i>Pay ₹${selectedPlan.price}`;
		document.querySelector('.plan-features-list li:first-child').innerHTML = `<i class="bi bi-check-circle-fill"></i> ${selectedPlan.storage} Storage`;
		
		// Handle payment submission
		document.getElementById('paymentForm').addEventListener('submit', async function(e) {
			e.preventDefault();
			
			const cardNumber = document.getElementById('cardNumber').value.replace(/\s/g, '');
			const expiryDate = document.getElementById('expiryDate').value;
			const cvv = document.getElementById('cvv').value;
			const cardName = document.getElementById('cardName').value;
			
			if (cardNumber.length < 16) {
				alert('Please enter a valid card number');
				return;
			}
			if (expiryDate.length < 5) {
				alert('Please enter a valid expiry date');
				return;
			}
			if (cvv.length < 3) {
				alert('Please enter a valid CVV');
				return;
			}
			if (!cardName.trim()) {
				alert('Please enter cardholder name');
				return;
			}
			
			// Show loading overlay
			const overlay = document.getElementById('loadingOverlay');
			const spinner = document.getElementById('loadingSpinner');
			const successCheck = document.getElementById('successCheck');
			const loadingText = document.getElementById('loadingText');
			
			overlay.classList.add('active');
			
			try {
				// Simulate payment processing
				await new Promise(resolve => setTimeout(resolve, 2000));
				
				// Send payment request to server
				const response = await fetch('/process-payment', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						plan: plan,
						amount: selectedPlan.price,
						cardNumber: cardNumber,
						expiryDate: expiryDate,
						cvv: cvv,
						cardName: cardName
					})
				});
				
				if (!response.ok) {
					throw new Error('Payment failed');
				}
				
				const result = await response.json();
				
				// Show success
				spinner.classList.add('d-none');
				successCheck.classList.remove('d-none');
				loadingText.innerHTML = '<strong style="color: #10b981;">Payment Successful!</strong><br>Redirecting to dashboard...';
				
				// Redirect after success
				setTimeout(() => {
					window.location.href = '/dashboard?upgraded=true&plan=' + plan;
				}, 2000);
				
			} catch (err) {
				console.error('Payment error:', err);
				overlay.classList.remove('active');
				alert('Payment failed. Please try again.');
			}
		});
	</script>
</body>
</html>
