<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Cloud File Storage</title>
	<link rel="stylesheet" href="/static/styles.css" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
</head>
<body>
	<nav class="navbar navbar-expand-lg glass-card sticky-top">
		<div class="container">
			<a class="navbar-brand d-flex align-items-center" href="/dashboard">
				<i class="bi bi-cloud-arrow-up-fill me-2 text-primary"></i>
				<span class="brand-title">Cloud Storage</span>
			</a>
			<div class="navbar-nav ms-auto align-items-center gap-3">
				<a href="/profile" class="btn btn-outline-light btn-sm nav-item" title="Profile">
					<i class="bi bi-person-circle"></i>
				</a>
				<form method="POST" action="/logout" class="nav-item mb-0">
					<button class="btn btn-outline-light btn-sm" type="submit" title="Logout">
						<i class="bi bi-box-arrow-right"></i>
					</button>
				</form>
			</div>
		</div>
	</nav>

	<div class="container py-5">
		<div class="row mb-4">
			<div class="col-12">
				<div class="text-center mb-5">
					<h1 class="display-5 fw-bold text-white mb-3">Your Cloud Storage</h1>
					<p class="lead text-muted">Upload, manage, and share your files securely</p>
				</div>
			</div>
		</div>

		<div class="row mb-4">
			<div class="col-12">
				<div class="glass-card p-4">
					<div class="d-flex align-items-center mb-3">
						<i class="bi bi-cloud-upload-fill text-primary fs-4 me-3"></i>
						<h3 class="h4 mb-0 text-white">Upload Files</h3>
					</div>
					<form id="upload-form">
						<div class="upload-area" id="upload-area">
							<div class="upload-content">
								<i class="bi bi-cloud-arrow-up upload-icon"></i>
								<h5>Drag & Drop your files here</h5>
								<p class="text-muted mb-3">or click to browse</p>
								<input type="file" id="file-input" class="form-control d-none" required />
								<button type="button" class="btn btn-gradient" id="browse-btn">
									<i class="bi bi-folder2-open me-2"></i>Choose Files
								</button>
							</div>
						</div>
						<div id="selected-file" class="mt-3 d-none">
							<div class="d-flex align-items-center justify-content-between p-3 bg-dark bg-opacity-50 rounded">
								<div class="d-flex align-items-center">
									<i class="bi bi-file-earmark me-2"></i>
									<span id="file-name"></span>
								</div>
								<button class="btn btn-primary btn-sm" type="submit">
									<i class="bi bi-upload me-1"></i>Upload
								</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col-12">
				<div class="glass-card p-4">
					<div class="d-flex justify-content-between align-items-center mb-4">
						<div class="d-flex align-items-center">
							<i class="bi bi-folder-fill text-warning fs-4 me-3"></i>
							<h3 class="h4 mb-0 text-white">Your Files</h3>
						</div>
						<button id="refresh-btn" class="btn btn-outline-light btn-sm">
							<i class="bi bi-arrow-clockwise me-1"></i>Refresh
						</button>
					</div>
					
					<div id="files-container" class="files-grid">
						<div class="text-center py-5">
							<i class="bi bi-inbox display-1 text-muted"></i>
							<p class="text-muted mt-3">Loading your files...</p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Share Modal -->
	<div class="modal fade" id="shareModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content glass-modal">
				<div class="modal-header border-0">
					<h5 class="modal-title text-white">
						<i class="bi bi-share-fill me-2 text-info"></i>Share File
					</h5>
					<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<p class="text-muted mb-3">Anyone with this link can download this file. Link expires in 7 days.</p>
					<div class="input-group mb-3">
						<input type="text" class="form-control" id="shareLinkInput" readonly />
						<button class="btn btn-gradient" type="button" id="copyShareBtn">
							<i class="bi bi-clipboard me-1"></i>Copy
						</button>
					</div>
					<div id="shareSuccess" class="alert alert-success d-none mb-0">
						<i class="bi bi-check-circle me-2"></i>Link copied to clipboard!
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/static/app.js"></script>
	<script>
		// Check for upgrade success message
		const urlParams = new URLSearchParams(window.location.search);
		if (urlParams.get('upgraded') === 'true') {
			const plan = urlParams.get('plan') || 'pro';
			const toast = document.createElement('div');
			toast.className = 'alert alert-success alert-dismissible fade show position-fixed';
			toast.style.cssText = 'top: 80px; right: 20px; z-index: 9999; min-width: 300px;';
			toast.innerHTML = `
				<i class="bi bi-check-circle-fill me-2"></i>
				<strong>Success!</strong> You have upgraded to the ${plan.toUpperCase()} plan!
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			`;
			document.body.appendChild(toast);
			
			// Auto dismiss after 5 seconds
			setTimeout(() => toast.remove(), 5000);
			
			// Clear the URL parameters
			window.history.replaceState({}, document.title, '/dashboard');
		}
	</script>
</body>
</html>
